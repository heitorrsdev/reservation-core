services:
  postgres_test:
    image: postgres:16
    container_name: barber_test_db
    restart: always
    environment:
      POSTGRES_DB: barber_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    volumes:
      - pg_test_data:/var/lib/postgresql/data

volumes:
  pg_test_data:
